{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment | MediCare Hospital</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<header>
    <nav>
        <h2>MediCare Hospital</h2>

        <ul>
            <li><a href="{% url 'index' %}">Home</a></li>
            <li><a href="{% url 'doctors' %}">Doctors</a></li>
            <li><a href="{% url 'departments' %}">Departments</a></li>
            <li><a href="{% url 'services' %}">Services</a></li>
            <li><a href="{% url 'appointment' %}">Appointment</a></li>
            <li><a href="{% url 'blogs' %}">Blogs</a></li>
            <li><a href="{% url 'gallery' %}">Gallery</a></li>
            <li><a href="{% url 'emergency' %}">Emergency</a></li>
            <li><a href="{% url 'contact' %}">Contact</a></li>
        </ul>
    </nav>
</header>


<section>
    <h2 style="text-align:center;">Book an Appointment</h2>

    <form method="POST" id="appointmentForm" style="max-width:500px; margin:auto;">
    {% csrf_token %}

        <label>Full Name</label><br>
        <input type="text" name="name" placeholder="Enter your full name" required style="width:100%; padding:10px;">

        <label>Email</label><br>
        <input type="email" name="email" placeholder="Enter your email" required style="width:100%; padding:10px;">

        <label>Phone Number</label><br>
        <input type="tel" name="phone" placeholder="Enter your phone number" required style="width:100%; padding:10px;">

        <label>Select Department</label><br>
        <select name="department" required style="width:100%; padding:10px;">
            <option>Cardiology</option>
            <option>Neurology</option>
            <option>Orthopedics</option>
            <option>Pediatrics</option>
            <option>General Medicine</option>
        </select><br><br>

        <label>Select Doctor</label><br>
        <select name="doctor" required style="width:100%; padding:10px;">
            <option>Dr. John Mathew</option>
            <option>Dr. Anjali Nair</option>
            <option>Dr. Arun Kumar</option>
            <option>Dr. Meera Joseph</option>
        </select><br><br>

        <label>Appointment Date</label><br>
        <input type="date" name="date" required style="width:100%; padding:10px;">

        <label>Message</label><br>
        <textarea name="message" rows="5" placeholder="Enter your message..." style="width:100%; padding:10px;"></textarea>

        <button type="submit">Book Appointment</button>

    </form>
</section>

<footer>
    <p>&copy; <span id="year"></span> MediCare Hospital. All Rights Reserved.</p>
</footer>

<script src="{% static 'js/script.js' %}"></script>

</body>
</html>
